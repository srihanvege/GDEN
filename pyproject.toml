[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpcrgen"
version = "0.1.0"
description = "GDEN — GPCR-conditioned molecular generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.28",
  "torch>=2.0",
]

[project.optional-dependencies]
rdkit = ["rdkit>=2023.3.1"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gpcrgen*"]
